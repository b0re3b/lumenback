version: "3.8"
services:
  localstack:
    image: localstack/localstack:3.0.2
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - DEBUG=1
    volumes:
      - ./01-create-buckets.sh:/etc/localstack/init/ready.d/01-create-buckets.sh
